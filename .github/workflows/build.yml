# PR이 올라오거나 main이 바뀔 때마다 GitHub 서버에서 Debug | x86 빌드를 해 본다.
# 결과는 PR 화면에 ✅ / ❌ 로 표시된다. ❌ 이면 merge 하지 말고 "Details"에서 오류를 확인한다.
name: Build (Debug x86)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check team rules
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/pr_rules.sh "$BASE" "$HEAD"

  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: microsoft/setup-msbuild@v2

      - name: Build SORModeler / MazeGame
        shell: pwsh
        run: |
          # 서버에 설치된 VS 툴셋 확인: v145(VS 2026)가 없으면 v143(VS 2022)으로 빌드
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $toolsets = @(Get-Item "$vs\MSBuild\Microsoft\VC\*\Platforms\Win32\PlatformToolsets\*" | Where-Object { $_.PSIsContainer } | Select-Object -ExpandProperty Name | Sort-Object -Unique)
          Write-Host "VS: $vs"
          Write-Host "installed toolsets: $($toolsets -join ', ')"
          $toolset = @('v145', 'v143') | Where-Object { $toolsets -contains $_ } | Select-Object -First 1
          if (-not $toolset) { Write-Host "::error::v145/v143 툴셋을 찾지 못함"; exit 1 }
          Write-Host "using toolset: $toolset"

          $failed = @()
          foreach ($p in 'SORModeler', 'MazeGame') {
            $src = @(Get-ChildItem $p -Recurse -Filter *.cpp -ErrorAction SilentlyContinue)
            if ($src.Count -eq 0) {
              # 아직 코드가 없으면 서버에서만 임시 파일을 만들어 빌드 도구·freeglut 링크를 점검 (커밋되지 않음)
              Write-Host "::notice::$p 에 아직 .cpp가 없어 임시 코드로 빌드 환경만 점검"
              "#include <GL/glut.h>`nint main(int argc, char** argv) { glutInit(&argc, argv); return 0; }" | Set-Content "$p/__ci_smoke.cpp"
            }
            Write-Host "::group::$p 빌드"
            msbuild "$p/$p.vcxproj" /p:Configuration=Debug /p:Platform=Win32 /p:PlatformToolset=$toolset /m /nologo /v:minimal
            if ($LASTEXITCODE -ne 0) { $failed += $p }
            Write-Host "::endgroup::"
          }
          if ($failed.Count -gt 0) {
            Write-Host "::error::빌드 실패: $($failed -join ', ')"
            exit 1
          }
